services:
  - type: web
    name: frapi-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GSB_API_KEY
        sync: false
      - key: VT_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        value: "https://frapi-frontend.onrender.com"

  - type: web
    name: frapi-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://frapi-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
